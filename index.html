<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>motor-calc</title>
    <style>
      /* MathLive Overrides & Desmos-style Keyboard Theme */
      math-field::part(virtual-keyboard-toggle), math-field::part(menu-toggle) { display: none !important; }
      math-virtual-keyboard {
        --keyboard-background: #edf1f5;
        --keyboard-toolbar-background: #f8fafc;
        --keyboard-toolbar-text: #475569;
        --keyboard-toolbar-text-active: #1a73e8;
        --keycap-background: #ffffff;
        --keycap-background-active: #e2e8f0;
        --keycap-text: #1e293b;
        --keycap-secondary-text: #64748b;
        --keycap-border: #cbd5e1;
        --keycap-border-bottom: #94a3b8;
        --keycap-shift-color: #1a73e8;
        --keycap-radius: 8px;
        --keycap-gap: 5px;
        --keycap-font-size: 1.15rem;
        --keycap-height: 2.6rem;
        box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.15) !important;
        border-top: 1px solid #cbd5e1 !important;
        z-index: 40 !important;
      }
      @media (max-width: 768px) {
        math-virtual-keyboard {
          --keycap-height: 2.35rem;
          --keycap-font-size: 1.05rem;
          --keycap-gap: 3px;
          --keycap-radius: 6px;
        }
      }
      :root, math-field, body {
        --contains-highlight-background: transparent !important;
        --highlight-background: transparent !important;
        --selection-background-color: rgba(66, 133, 244, 0.25) !important;
        --placeholder-color: transparent !important;
        --placeholder-opacity: 0 !important;
        --prompt-border: none !important;
        --prompt-background: transparent !important;
        --prompt-highlight-color: transparent !important;
        --caret-color: #1f2937 !important;
        --selection-color: #1f2937 !important;
      }
      math-field::part(container) { background-color: transparent !important; }
      math-field:focus-within { background-color: transparent !important; outline: none !important; }
      math-field::part(selection), .ML__selection {
        background: rgba(66, 133, 244, 0.25) !important;
        background-color: rgba(66, 133, 244, 0.25) !important;
        border-radius: 2px !important;
      }
      .ML__selected {
        color: #1f2937 !important;
        background: transparent !important;
      }
      .ML__contains-highlight, .ML__highlight, .ML__focused, .ML__placeholder, .ML__prompt, .ML__empty {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      math-field::part(placeholder), math-field::part(prompt), .ML__placeholder { background: transparent !important; border: none !important; }
      /* Evita que o scroll da lista arraste a página no mobile */
      #expressions-list { overscroll-behavior: contain; }
    </style>
    <!-- Tailwind via Vite plugin (processado em build) -->
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body class="flex flex-col-reverse md:flex-row h-screen overflow-hidden bg-white text-gray-800 font-sans antialiased">
    
    <!-- ═══════════════════════════════════════
         SIDEBAR — Painel de Expressões
    ══════════════════════════════════════════ -->
    <div id="sidebar" class="w-full md:w-[380px] bg-white border-t md:border-t-0 md:border-r border-gray-200 shadow-lg flex flex-col shrink-0 overflow-hidden z-10 h-[42vh] md:h-auto relative">

      <div id="sidebar-header" class="bg-white px-2.5 py-2 border-b border-gray-200 flex items-center justify-between select-none shrink-0 relative shadow-2xs z-30 overflow-visible">
        <div id="drag-handle" class="w-8 h-1 bg-gray-300 rounded-full block md:hidden shadow-inner absolute -top-1 left-1/2 -translate-x-1/2"></div>
        
        <!-- Left Tools: Add Item (+), Undo, Redo -->
        <div class="flex items-center gap-1">
          <!-- Add Item Button (+) with Dropdown -->
          <div class="relative overflow-visible">
            <button id="add-item-btn" type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 transition-all cursor-pointer font-bold text-lg select-none" title="Adicionar Item">
              <i data-lucide="plus" class="w-5 h-5 pointer-events-none"></i>
            </button>

            <!-- Dropdown Menu -->
            <div id="add-item-dropdown" class="absolute top-10 left-0 bg-white rounded-xl shadow-2xl border border-gray-200 py-1.5 w-44 z-50 hidden flex-col divide-y divide-gray-100">
              <button id="menu-add-expr" type="button" class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 text-gray-700 hover:text-blue-600 text-xs font-semibold cursor-pointer transition-colors text-left">
                <span class="w-5 text-center font-serif italic font-bold text-blue-600 pointer-events-none">f(x)</span>
                <span class="pointer-events-none">Expressão</span>
              </button>
              <button id="menu-add-note" type="button" class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-amber-50 text-gray-700 hover:text-amber-600 text-xs font-semibold cursor-pointer transition-colors text-left">
                <span class="w-5 text-center font-serif text-base font-bold text-amber-500 pointer-events-none">“ ”</span>
                <span class="pointer-events-none">Nota</span>
              </button>
              <button id="menu-add-table" type="button" class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-indigo-50 text-gray-700 hover:text-indigo-600 text-xs font-semibold cursor-pointer transition-colors text-left">
                <i data-lucide="table" class="w-4 h-4 text-indigo-500 pointer-events-none"></i>
                <span class="pointer-events-none">Tabela</span>
              </button>
              <button id="menu-add-matrix" type="button" class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-purple-50 text-gray-700 hover:text-purple-600 text-xs font-semibold cursor-pointer transition-colors text-left">
                <span class="w-5 text-center font-mono font-bold text-purple-600 text-xs pointer-events-none">[M]</span>
                <span class="pointer-events-none">Matriz</span>
              </button>
              <button id="menu-add-folder" type="button" class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-emerald-50 text-gray-700 hover:text-emerald-600 text-xs font-semibold cursor-pointer transition-colors text-left">
                <i data-lucide="folder" class="w-4 h-4 text-emerald-500 pointer-events-none"></i>
                <span class="pointer-events-none">Pasta</span>
              </button>
            </div>
          </div>

          <!-- Undo & Redo -->
          <button id="undo-btn" title="Desfazer (Ctrl+Z)" class="w-7 h-7 flex items-center justify-center text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-md transition-all cursor-pointer disabled:opacity-25 disabled:cursor-not-allowed" disabled>
            <i data-lucide="undo-2" class="w-4 h-4"></i>
          </button>
          <button id="redo-btn" title="Refazer (Ctrl+Y)" class="w-7 h-7 flex items-center justify-center text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-md transition-all cursor-pointer disabled:opacity-25 disabled:cursor-not-allowed" disabled>
            <i data-lucide="redo-2" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Center: Title -->
        <div class="flex items-center gap-1.5 opacity-80 hover:opacity-100 transition-opacity">
          <span class="text-base font-black text-blue-600 leading-none">∑</span>
          <span class="text-xs font-bold text-gray-700 tracking-tight">motor<span class="font-normal text-gray-400">zao</span></span>
        </div>

        <!-- Right Header Controls: Guide / Help & Collapse Chevron -->
        <div class="flex items-center gap-1">
          <button id="guide-sidebar-btn" title="Guia de Comandos & Ajuda (?)" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-all cursor-pointer" onclick="if(window._toggleCommandsGuide) window._toggleCommandsGuide()">
            <i data-lucide="help-circle" class="w-4 h-4"></i>
          </button>
          <button id="collapse-sidebar-btn" class="hidden md:flex items-center justify-center w-7 h-7 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-all cursor-pointer" title="Ocultar Painel Lateral">
            <i data-lucide="chevrons-left" class="w-4 h-4"></i>
          </button>
          <button id="toggle-sidebar-mobile-btn" class="flex md:hidden items-center justify-center w-7 h-7 text-gray-500 hover:text-blue-600 rounded-md transition-colors" title="Recolher / Expandir Painel">
            <i data-lucide="chevron-down" id="sidebar-chevron-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- LISTA DE EXPRESSÕES — scrollable -->
      <div id="expressions-list" class="flex flex-col gap-0 overflow-y-auto flex-1 overscroll-contain"></div>
      
      <!-- Compatibilidade para testes e atalhos legacy -->
      <div class="hidden">
        <button id="add-expr-btn"></button>
        <button id="add-table-btn"></button>
        <button id="add-matrix-btn"></button>
        <button id="add-note-btn"></button>
        <button id="add-folder-btn"></button>
      </div>

      <!-- Sliders Dinâmicos -->
      <div id="sliders-container" class="px-3 pb-3 shrink-0"></div>
    </div>

    <!-- Borda arrastável da barra lateral (Desktop) -->
    <div id="sidebar-resizer" class="hidden md:flex items-center justify-center w-1.5 hover:w-2 bg-gray-200 hover:bg-purple-500 active:bg-purple-600 cursor-col-resize z-20 transition-all select-none touch-none shrink-0 group relative" title="Arraste a borda para redimensionar a barra lateral">
      <div class="w-0.5 h-7 bg-gray-400 group-hover:bg-white group-active:bg-white rounded-full transition-colors pointer-events-none"></div>
    </div>

    <!-- Botão flutuante para restaurar a barra lateral quando recolhida -->
    <button id="sidebar-expand-tab" class="fixed left-0 top-14 z-30 hidden bg-white hover:bg-purple-50 border border-gray-200 border-l-0 shadow-md py-2 px-1.5 rounded-r-lg text-gray-600 hover:text-purple-600 cursor-pointer transition-all flex items-center justify-center group" title="Expandir barra lateral">
      <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform text-purple-600"></i>
    </button>

    <!-- ═══════════════════════════════════════
         ÁREA DO GRÁFICO
    ══════════════════════════════════════════ -->
    <div id="graph-container" class="grow relative overflow-hidden bg-white">
      <canvas id="webglCanvas" class="block w-full h-full absolute inset-0 pointer-events-none"></canvas>
      <canvas id="graphCanvas" class="block w-full h-full relative bg-transparent"></canvas>
      <canvas id="canvas3d" class="block w-full h-full absolute inset-0 hidden bg-transparent"></canvas>
      
      <!-- Alternador de Modo 2D / 3D (Estilo Desmos/GeoGebra) -->
      <!-- Alternador de Modo 2D / 3D (Estilo Desmos/GeoGebra) -->
      <div id="mode-switcher" class="absolute top-4 left-4 z-20 flex items-center bg-white/95 backdrop-blur-sm rounded-lg shadow-sm border border-gray-200 p-1 select-none">
        <button id="mode-2d-btn" class="px-3 py-1 text-xs font-bold rounded-md transition-all bg-blue-600 text-white shadow-xs cursor-pointer">2D</button>
        <button id="mode-3d-btn" class="px-3 py-1 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-900 cursor-pointer">3D</button>
      </div>
      
      <!-- Controles Flutuantes do HUD (Estilo Desmos: Chave Inglesa e Cápsula de Zoom Vertical) -->
      <div class="absolute top-4 right-4 flex flex-col items-center gap-2 z-20 select-none">
        <!-- Botão Configurações do Gráfico (Ícone Wrench / Chave Inglesa) -->
        <button id="settings-btn" title="Configurações do Gráfico" class="w-9 h-9 flex items-center justify-center bg-white/95 backdrop-blur-sm rounded-lg shadow-sm border border-gray-200 text-gray-600 hover:text-gray-900 hover:bg-gray-50 active:bg-gray-100 transition-all cursor-pointer" onclick="if(window._toggleSettings) window._toggleSettings()">
          <i data-lucide="wrench" class="w-4 h-4"></i>
        </button>

        <!-- Cápsula Vertical de Zoom Integrada (Zoom In, Zoom Out, Vista Padrão) -->
        <div class="flex flex-col bg-white/95 backdrop-blur-sm rounded-lg shadow-sm border border-gray-200 overflow-hidden divide-y divide-gray-200">
          <button id="zoom-in-btn" title="Aproximar (+)" class="w-9 h-9 flex items-center justify-center text-gray-600 hover:text-blue-600 hover:bg-gray-50 active:bg-gray-100 transition-colors cursor-pointer" onclick="if(window._zoomIn) window._zoomIn()">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
          <button id="zoom-out-btn" title="Afastar (-)" class="w-9 h-9 flex items-center justify-center text-gray-600 hover:text-blue-600 hover:bg-gray-50 active:bg-gray-100 transition-colors cursor-pointer" onclick="if(window._zoomOut) window._zoomOut()">
            <i data-lucide="minus" class="w-4 h-4"></i>
          </button>
          <button id="reset-view-btn" title="Padrão (Vista Padrão)" class="w-9 h-9 flex items-center justify-center text-gray-600 hover:text-blue-600 hover:bg-gray-50 active:bg-gray-100 transition-colors cursor-pointer" onclick="if(window._resetView) window._resetView()">
            <i data-lucide="home" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      
      <!-- Coordenadas do cursor -->
      <div id="cursor-coords" class="absolute bottom-3 right-4 text-xs text-gray-500 font-mono pointer-events-none hidden md:block bg-white/80 px-2 py-1 rounded backdrop-blur-sm shadow-sm border border-gray-100"></div>

      <!-- Botão Flutuante do Teclado Virtual (Estilo Desmos, posicionado dentro da área do gráfico) -->
      <button id="toggle-keyboard-btn" title="Alternar Teclado Virtual" class="absolute bottom-3 left-3 z-20 flex items-center justify-center gap-1.5 px-3 py-1.5 bg-white/95 backdrop-blur-md rounded-lg shadow-sm border border-gray-200 text-gray-700 hover:text-blue-600 hover:border-blue-300 transition-all cursor-pointer select-none active:scale-95 font-medium text-xs">
        <i data-lucide="keyboard" id="keyboard-btn-icon" class="w-4 h-4 text-blue-600"></i>
        <span class="hidden sm:inline font-semibold">Teclado</span>
      </button>
    </div>
    <!-- ═══════════════════════════════════════
         GRAPH SETTINGS POPOVER (Desmos Style)
    ══════════════════════════════════════════ -->
    <div id="graph-settings-popover" class="fixed top-14 right-4 z-50 hidden flex-col w-[320px] max-w-[92vw] bg-white/98 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200/90 text-gray-800 text-xs overflow-hidden transition-all duration-150 select-none">
      
      <!-- Popover Header -->
      <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/70">
        <div class="flex items-center gap-2 font-bold text-gray-800 text-sm">
          <i data-lucide="wrench" class="w-4 h-4 text-gray-500"></i>
          <span>Configurações do Gráfico</span>
        </div>
        <button id="close-settings-btn" class="text-gray-400 hover:text-gray-700 transition-colors p-1 rounded-md hover:bg-gray-200/60 cursor-pointer" onclick="if(window._toggleSettings) window._toggleSettings()">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Popover Body -->
      <div class="p-4 flex flex-col gap-3.5 max-h-[75vh] overflow-y-auto">
        
        <!-- 1. Modo Projetor (Projector Mode) -->
        <div class="flex justify-between items-center py-0.5">
          <span class="font-semibold text-gray-700">Modo Projetor</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="setting-projector" class="sr-only peer">
            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
          </label>
        </div>

        <div class="h-px bg-gray-100"></div>

        <!-- 2. Malha / Grelha -->
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-center">
            <span class="font-semibold text-gray-700">Grelha</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setting-grid" class="sr-only peer" checked>
              <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
          </div>
          <!-- Segmented Grid Control -->
          <div id="grid-type-segmented" class="grid grid-cols-2 p-0.5 bg-gray-100 rounded-lg text-center font-medium text-gray-600 mt-1">
            <button id="grid-type-cartesian" class="py-1 rounded-md text-xs font-semibold bg-white text-blue-600 shadow-xs cursor-pointer transition-all">Cartesiana</button>
            <button id="grid-type-polar" class="py-1 rounded-md text-xs font-semibold hover:text-gray-900 cursor-pointer transition-all">Polar</button>
          </div>
        </div>

        <div class="h-px bg-gray-100"></div>

        <!-- 3. Eixos e Setas -->
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="font-semibold text-gray-700">Mostrar Eixos</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setting-axes" class="sr-only peer" checked>
              <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-600 text-xs">Setas nos Eixos</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setting-arrows" class="sr-only peer">
              <div class="w-8 h-4.5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
          </div>
        </div>

        <!-- Eixo X Config -->
        <div class="flex flex-col gap-1.5 p-2.5 bg-gray-50/80 rounded-xl border border-gray-100">
          <span class="font-bold text-gray-700 text-[11px] uppercase tracking-wider">Eixo X</span>
          <div class="flex items-center gap-1.5 text-gray-600">
            <input type="text" id="setting-xmin" class="w-16 px-1.5 py-1 text-center bg-white border border-gray-200 rounded-md font-mono text-xs focus:border-blue-500 focus:outline-none" value="-10">
            <span class="text-gray-400 font-semibold">≤ x ≤</span>
            <input type="text" id="setting-xmax" class="w-16 px-1.5 py-1 text-center bg-white border border-gray-200 rounded-md font-mono text-xs focus:border-blue-500 focus:outline-none" value="10">
          </div>
          <div class="flex items-center gap-2 mt-1">
            <div class="flex items-center gap-1 grow">
              <span class="text-[10px] text-gray-500">Passo:</span>
              <input type="text" id="setting-xstep" class="w-14 px-1 py-0.5 text-center bg-white border border-gray-200 rounded text-xs focus:border-blue-500 focus:outline-none" placeholder="auto">
            </div>
            <div class="flex items-center gap-1 grow">
              <span class="text-[10px] text-gray-500">Legenda:</span>
              <input type="text" id="setting-xlabel" class="w-16 px-1 py-0.5 bg-white border border-gray-200 rounded text-xs focus:border-blue-500 focus:outline-none" placeholder="x">
            </div>
          </div>
        </div>

        <!-- Eixo Y Config -->
        <div class="flex flex-col gap-1.5 p-2.5 bg-gray-50/80 rounded-xl border border-gray-100">
          <span class="font-bold text-gray-700 text-[11px] uppercase tracking-wider">Eixo Y</span>
          <div class="flex items-center gap-1.5 text-gray-600">
            <input type="text" id="setting-ymin" class="w-16 px-1.5 py-1 text-center bg-white border border-gray-200 rounded-md font-mono text-xs focus:border-blue-500 focus:outline-none" value="-10">
            <span class="text-gray-400 font-semibold">≤ y ≤</span>
            <input type="text" id="setting-ymax" class="w-16 px-1.5 py-1 text-center bg-white border border-gray-200 rounded-md font-mono text-xs focus:border-blue-500 focus:outline-none" value="10">
          </div>
          <div class="flex items-center gap-2 mt-1">
            <div class="flex items-center gap-1 grow">
              <span class="text-[10px] text-gray-500">Passo:</span>
              <input type="text" id="setting-ystep" class="w-14 px-1 py-0.5 text-center bg-white border border-gray-200 rounded text-xs focus:border-blue-500 focus:outline-none" placeholder="auto">
            </div>
            <div class="flex items-center gap-1 grow">
              <span class="text-[10px] text-gray-500">Legenda:</span>
              <input type="text" id="setting-ylabel" class="w-16 px-1 py-0.5 bg-white border border-gray-200 rounded text-xs focus:border-blue-500 focus:outline-none" placeholder="y">
            </div>
          </div>
        </div>

        <div class="h-px bg-gray-100"></div>

        <!-- 4. Ângulos (Radianos vs Graus) -->
        <div class="flex items-center justify-between">
          <span class="font-semibold text-gray-700">Ângulos</span>
          <div id="angle-mode-segmented" class="grid grid-cols-2 p-0.5 bg-gray-100 rounded-lg text-center font-medium text-gray-600 w-36">
            <button id="angle-mode-radians" class="py-1 rounded-md text-xs font-semibold bg-white text-blue-600 shadow-xs cursor-pointer transition-all">Radianos</button>
            <button id="angle-mode-degrees" class="py-1 rounded-md text-xs font-semibold hover:text-gray-900 cursor-pointer transition-all">Graus</button>
          </div>
        </div>

        <div class="h-px bg-gray-100"></div>

        <!-- 5. Limpar Tudo -->
        <button id="clear-all-btn" class="w-full py-2 px-3 flex items-center justify-center gap-2 text-xs font-semibold text-red-600 hover:text-white bg-red-50 hover:bg-red-600 border border-red-200 hover:border-red-600 rounded-xl transition-all cursor-pointer shadow-2xs" onclick="if(window._clearAll) window._clearAll()">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>Limpar Todas as Expressões</span>
        </button>

      </div>
    </div>

    <!-- Hidden compatibility div for modal reference -->
    <div id="settings-modal" class="hidden"></div>

    <script>
      // Configuração global para o motor Giac WebAssembly
      window.Module = {
          onRuntimeInitialized: function() {
              console.log("[Giac] Motor inicializado via onRuntimeInitialized!");
              window.giacReady = true;
          },
          print: function(t) { console.log('[Giac]', t); },
          printErr: function(t) { console.warn('[Giac Erro]', t); }
      };
      const _giacPoll = setInterval(() => {
          if (!window.giacReady && window.Module && (typeof window.Module.cwrap === 'function' || typeof window.Module._caseval === 'function')) {
              window.giacReady = true;
              console.log("[Giac] Motor inicializado via polling!");
              clearInterval(_giacPoll);
          } else if (window.giacReady) {
              clearInterval(_giacPoll);
          }
      }, 300);
    </script>
