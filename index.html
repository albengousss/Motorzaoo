<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motor Gráfico Avançado</title>    <style>
      /* MathLive Overrides - Must remain */
      @media (min-width: 769px) { math-field::part(virtual-keyboard-toggle) { display: none; } }
      @media (max-width: 768px) {
        math-virtual-keyboard { --keyboard-height: 35vh; --keycap-height: 2.2rem; --keycap-font-size: 1.2rem; --keyboard-background: #f1f3f4; }
      }
      :root, math-field, body {
        --contains-highlight-background: transparent !important;
        --highlight-background: transparent !important;
        --selection-background-color: rgba(180, 200, 255, 0.4) !important;
        --placeholder-color: transparent !important;
        --keyboard-background: #f1f3f4;
      }
      math-field::part(container) { background-color: transparent !important; }
      math-field:focus-within { background-color: transparent !important; outline: none !important; }
      .ML__contains-highlight, .ML__highlight, .ML__selection, .ML__focused { background: transparent !important; background-color: transparent !important; }
      math-field {
        --placeholder-color: #a0a0a0 !important;
        --placeholder-opacity: 0.5 !important;
        --caret-color: #000 !important;
      }
      math-field::part(placeholder) { background: transparent !important; background-color: transparent !important; }
      .ML__placeholder { background: transparent !important; background-color: transparent !important; }
    </style>
    <!-- KaTeX CSS e Script -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex flex-col-reverse md:flex-row h-screen overflow-hidden bg-white text-gray-800 font-sans">
    
    <!-- Painel Esquerdo -->
    <div id="sidebar" class="w-full md:w-[380px] md:min-w-[250px] md:resize-x bg-white border-t md:border-t-0 md:border-r border-gray-200 shadow-md flex flex-col shrink-0 p-0 overflow-y-auto overflow-x-hidden z-10 h-[40vh] md:h-auto">
      <div id="sidebar-header" class="bg-white px-5 py-4 font-semibold text-blue-600 text-base border-b border-gray-200 flex flex-col items-center justify-center gap-2 shadow-sm touch-none">
        <div id="drag-handle" class="w-10 h-1 bg-gray-300 rounded-full md:hidden mb-1 shadow-inner block"></div>
        <div class="w-full flex justify-between items-center">
          <span><span class="text-lg align-middle mr-2 font-extrabold text-blue-400">∑</span> motor<span class="font-light text-gray-600">-calc</span></span>
        </div>
      </div>
      
      <div id="expressions-list" class="flex flex-col gap-0"></div>
      
      <button id="add-expr-btn" class="mx-4 my-3 p-3 cursor-pointer bg-white border border-gray-300 rounded-lg text-blue-600 font-medium text-sm transition-all hover:bg-gray-50 hover:shadow-sm">
        + Adicionar Expressão
      </button>

      <div id="sliders-container" class="mt-5 px-4 pb-4"></div>
    </div>

    <!-- Painel Direito: Gráfico -->
    <div id="graph-container" class="grow relative">
      <canvas id="graphCanvas" class="block w-full h-full bg-white"></canvas>
    </div>
    
    <script>
      // Configuração global para o Giac rodar na thread principal!
      window.Module = {
          onRuntimeInitialized: function() {
              console.log("Giac (Main Thread) inicializado via onRuntimeInitialized!");
              window.giacReady = true;
          },
          print: function(t) { console.log('Giac:', t); },
          printErr: function(t) { console.error('Giac Erro:', t); }
      };
      // Fallback polling caso onRuntimeInitialized não dispare
      setInterval(() => {
          if (!window.giacReady && window.Module && (typeof window.Module.cwrap === 'function' || typeof window.Module._caseval === 'function')) {
              window.giacReady = true;
              console.log("Giac (Main Thread) inicializado via polling!");
          }
      }, 500);
    </script>
    <script src="/giacwasm.js" onerror="console.error('Falha ao carregar giacwasm.js da pasta public. Use o CDN.')"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
