<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>motor-calc</title>
    <style>
      /* MathLive Overrides & Desmos-style Keyboard Theme */
      @media (min-width: 769px) { math-field::part(virtual-keyboard-toggle) { display: none; } }
      math-virtual-keyboard {
        --keyboard-background: #edf1f5;
        --keyboard-toolbar-background: #f8fafc;
        --keyboard-toolbar-text: #475569;
        --keyboard-toolbar-text-active: #1a73e8;
        --keycap-background: #ffffff;
        --keycap-background-active: #e2e8f0;
        --keycap-text: #1e293b;
        --keycap-secondary-text: #64748b;
        --keycap-border: #cbd5e1;
        --keycap-border-bottom: #94a3b8;
        --keycap-shift-color: #1a73e8;
        --keycap-radius: 8px;
        --keycap-gap: 5px;
        --keycap-font-size: 1.15rem;
        --keycap-height: 2.6rem;
        box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.15) !important;
        border-top: 1px solid #cbd5e1 !important;
        z-index: 40 !important;
      }
      @media (max-width: 768px) {
        math-virtual-keyboard {
          --keycap-height: 2.35rem;
          --keycap-font-size: 1.05rem;
          --keycap-gap: 3px;
          --keycap-radius: 6px;
        }
      }
      :root, math-field, body {
        --contains-highlight-background: transparent !important;
        --highlight-background: transparent !important;
        --selection-background-color: rgba(66, 133, 244, 0.25) !important;
        --placeholder-color: transparent !important;
        --placeholder-opacity: 0 !important;
        --prompt-border: none !important;
        --prompt-background: transparent !important;
        --prompt-highlight-color: transparent !important;
        --caret-color: #1f2937 !important;
      }
      math-field::part(container) { background-color: transparent !important; }
      math-field:focus-within { background-color: transparent !important; outline: none !important; }
      .ML__contains-highlight, .ML__highlight, .ML__selection, .ML__focused, .ML__placeholder, .ML__prompt, .ML__empty {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      math-field::part(placeholder), math-field::part(prompt), .ML__placeholder { background: transparent !important; border: none !important; }
      /* Evita que o scroll da lista arraste a página no mobile */
      #expressions-list { overscroll-behavior: contain; }
    </style>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind via Vite plugin (processado em build) -->
    <link rel="stylesheet" href="/src/style.css">
    <!-- Tailwind CDN como fallback para dev sem build step (remove em produção se quiser) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex flex-col-reverse md:flex-row h-screen overflow-hidden bg-white text-gray-800 font-sans antialiased">
    
    <!-- ═══════════════════════════════════════
         SIDEBAR — Painel de Expressões
    ══════════════════════════════════════════ -->
    <div id="sidebar" class="w-full md:w-[380px] md:min-w-[240px] md:resize-x bg-white border-t md:border-t-0 md:border-r border-gray-200 shadow-lg flex flex-col shrink-0 overflow-hidden z-10 h-[42vh] md:h-auto">

      <div id="sidebar-header" class="bg-white px-3 py-2 border-b border-gray-100 flex justify-between items-center shadow-[0_2px_4px_rgba(0,0,0,0.02)] touch-none select-none shrink-0">
        <div class="flex items-center justify-between w-full relative">
            <div id="drag-handle" class="w-8 h-1 bg-gray-300 rounded-full block md:hidden shadow-inner absolute -top-1 left-1/2 -translate-x-1/2"></div>
            <div class="flex items-center gap-1.5 mt-2 md:mt-0">
                <span class="text-lg font-black text-blue-500 leading-none">∑</span>
                <span class="text-sm font-semibold text-gray-800 tracking-tight">motor<span class="font-light text-gray-400">-calc</span></span>
            </div>
            
            <!-- Ferramental Superior: Undo, Redo e Mobile Collapse -->
            <div class="flex items-center gap-1 mt-2 md:mt-0">
                <button id="undo-btn" title="Desfazer (Ctrl+Z)" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-all cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button id="redo-btn" title="Refazer (Ctrl+Y)" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-all cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
                <button id="toggle-sidebar-mobile-btn" class="flex md:hidden items-center justify-center w-7 h-7 text-gray-500 hover:text-blue-600 rounded-md transition-colors" title="Recolher / Expandir Painel">
                    <i data-lucide="chevron-down" id="sidebar-chevron-icon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
      </div>
      
      <!-- LISTA DE EXPRESSÕES — scrollable -->
      <div id="expressions-list" class="flex flex-col gap-0 overflow-y-auto flex-1 overscroll-contain"></div>
      
      <!-- Botões Adicionar (Expressão, Tabela, Matriz, Nota, Pasta) -->
      <div class="px-2 py-2 shrink-0 border-t border-gray-100 bg-gray-50/70">
        <div class="grid grid-cols-5 gap-1">
          <button id="add-expr-btn" class="flex flex-col items-center justify-center py-1.5 px-0.5 bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-lg text-[10px] font-semibold text-gray-700 hover:text-blue-600 transition-all shadow-xs cursor-pointer active:scale-95" title="Adicionar Expressão Matemática">
            <i data-lucide="plus" class="w-3.5 h-3.5 text-blue-500 mb-0.5"></i>
            <span>Expressão</span>
          </button>
          <button id="add-table-btn" class="flex flex-col items-center justify-center py-1.5 px-0.5 bg-white hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 rounded-lg text-[10px] font-semibold text-gray-700 hover:text-indigo-600 transition-all shadow-xs cursor-pointer active:scale-95" title="Adicionar Tabela de Coordenadas (x, y)">
            <i data-lucide="table" class="w-3.5 h-3.5 text-indigo-500 mb-0.5"></i>
            <span>Tabela</span>
          </button>
          <button id="add-matrix-btn" class="flex flex-col items-center justify-center py-1.5 px-0.5 bg-white hover:bg-purple-50 border border-gray-200 hover:border-purple-300 rounded-lg text-[10px] font-semibold text-gray-700 hover:text-purple-600 transition-all shadow-xs cursor-pointer active:scale-95" title="Adicionar Editor de Matriz Interativa">
            <i data-lucide="grid-3x3" class="w-3.5 h-3.5 text-purple-500 mb-0.5"></i>
            <span>Matriz</span>
          </button>
          <button id="add-note-btn" class="flex flex-col items-center justify-center py-1.5 px-0.5 bg-white hover:bg-amber-50 border border-gray-200 hover:border-amber-300 rounded-lg text-[10px] font-semibold text-gray-700 hover:text-amber-600 transition-all shadow-xs cursor-pointer active:scale-95" title="Adicionar Bloco de Nota Explicativa">
            <i data-lucide="file-text" class="w-3.5 h-3.5 text-amber-500 mb-0.5"></i>
            <span>Nota</span>
          </button>
          <button id="add-folder-btn" class="flex flex-col items-center justify-center py-1.5 px-0.5 bg-white hover:bg-emerald-50 border border-gray-200 hover:border-emerald-300 rounded-lg text-[10px] font-semibold text-gray-700 hover:text-emerald-600 transition-all shadow-xs cursor-pointer active:scale-95" title="Adicionar Pasta Retrátil">
            <i data-lucide="folder" class="w-3.5 h-3.5 text-emerald-500 mb-0.5"></i>
            <span>Pasta</span>
          </button>
        </div>
      </div>

      <!-- Sliders Dinâmicos -->
      <div id="sliders-container" class="px-3 pb-3 shrink-0"></div>
    </div>

    <!-- ═══════════════════════════════════════
         ÁREA DO GRÁFICO
    ══════════════════════════════════════════ -->
    <div id="graph-container" class="grow relative overflow-hidden bg-white">
      <canvas id="webglCanvas" class="block w-full h-full absolute inset-0 pointer-events-none"></canvas>
      <canvas id="graphCanvas" class="block w-full h-full relative bg-transparent"></canvas>
      <canvas id="canvas3d" class="block w-full h-full absolute inset-0 hidden bg-transparent"></canvas>
      
      <!-- Alternador de Modo 2D / 3D (Estilo Desmos/GeoGebra) -->
      <div id="mode-switcher" class="absolute top-4 left-4 z-20 flex items-center bg-white/90 backdrop-blur-sm rounded-xl shadow-md border border-gray-200 p-1 select-none">
        <button id="mode-2d-btn" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-sm cursor-pointer">2D</button>
        <button id="mode-3d-btn" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-900 cursor-pointer">3D</button>
      </div>
      
      <!-- Botoes flutuantes -->
      <div class="absolute top-4 right-4 flex flex-col gap-2 z-20">
        <button id="reset-view-btn" title="Repor Vista" class="w-10 h-10 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full shadow-md text-gray-500 hover:text-blue-500 hover:shadow-lg transition-all border border-gray-200" onclick="if(window._resetView) window._resetView()">
          <i data-lucide="home" class="w-5 h-5"></i>
        </button>
        <button id="settings-btn" title="Configurações" class="w-10 h-10 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full shadow-md text-gray-500 hover:text-blue-500 hover:shadow-lg transition-all border border-gray-200" onclick="if(window._toggleSettings) window._toggleSettings()">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
        <button id="clear-all-btn" title="Limpar Tudo" class="w-10 h-10 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full shadow-md text-gray-500 hover:text-red-500 hover:shadow-lg transition-all border border-gray-200" onclick="if(window._clearAll) window._clearAll()">
          <i data-lucide="trash-2" class="w-5 h-5"></i>
        </button>
      </div>
      
      <!-- Coordenadas do cursor -->
      <div id="cursor-coords" class="absolute bottom-3 right-4 text-xs text-gray-500 font-mono pointer-events-none hidden md:block bg-white/80 px-2 py-1 rounded backdrop-blur-sm shadow-sm border border-gray-100"></div>

      <!-- Botão Flutuante do Teclado Virtual (Estilo Desmos) -->
      <button id="toggle-keyboard-btn" title="Alternar Teclado Virtual" class="fixed bottom-3 left-3 z-30 flex items-center justify-center gap-1.5 px-3 py-2 bg-white/95 backdrop-blur-md rounded-xl shadow-lg border border-gray-200 text-gray-700 hover:text-blue-600 hover:border-blue-300 transition-all cursor-pointer select-none active:scale-95 font-medium text-xs">
        <i data-lucide="keyboard" id="keyboard-btn-icon" class="w-4 h-4 text-blue-600"></i>
        <span class="hidden sm:inline font-semibold">Teclado</span>
      </button>
    </div>
    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col border border-gray-100">
        <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
          <h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-gray-500"></i> Configurações do Gráfico</h3>
          <button id="close-settings-btn" class="text-gray-400 hover:text-gray-700 transition-colors p-1" onclick="if(window._toggleSettings) window._toggleSettings()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-5 flex flex-col gap-5">
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">Mostrar Eixos</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setting-axes" class="sr-only peer" checked onchange="if(window._updateSettings) window._updateSettings()">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700">Mostrar Grelha (Grid)</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="setting-grid" class="sr-only peer" checked onchange="if(window._updateSettings) window._updateSettings()">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
          </div>
        </div>
      </div>
    <script>
      // Configuração global para o motor Giac WebAssembly
      window.Module = {
          onRuntimeInitialized: function() {
              console.log("[Giac] Motor inicializado via onRuntimeInitialized!");
              window.giacReady = true;
          },
          print: function(t) { console.log('[Giac]', t); },
          printErr: function(t) { console.warn('[Giac Erro]', t); }
      };
      const _giacPoll = setInterval(() => {
          if (!window.giacReady && window.Module && (typeof window.Module.cwrap === 'function' || typeof window.Module._caseval === 'function')) {
              window.giacReady = true;
              console.log("[Giac] Motor inicializado via polling!");
              clearInterval(_giacPoll);
          } else if (window.giacReady) {
              clearInterval(_giacPoll);
          }
      }, 300);
    </script>
    <script src="/giacwasm.js"></script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
